[package]
name = "voucher-workbench"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Local voucher image and PDF workbench"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
calamine = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp"] }
lopdf = "0.38"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
clap = { version = "4", features = ["derive"] }
webbrowser = "1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
zip = { version = "4.2", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
