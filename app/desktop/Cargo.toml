[package]
name = "pdf-workbench-desktop"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "PDF工作台 desktop application"

[[bin]]
name = "pdf-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
rfd = "=0.17.2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
voucher-workbench = { path = ".." }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
