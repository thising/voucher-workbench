name: Windows x64 checks and test package

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/windows.yml', '.gitattributes']
  pull_request:
    paths: ['app/**', '.github/workflows/windows.yml', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out tool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          $settings = Get-Content app/distribution/windows-dependencies.json -Raw | ConvertFrom-Json
          rustup toolchain install $settings.rust_toolchain --profile minimal --component rustfmt --component clippy --target $settings.target
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }

      - name: Test Windows build and optionally assemble ZIP
        env:
          PACKAGE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          $checksOnly = $env:PACKAGE_REQUESTED -ne 'true'
          ./app/tools/build-windows.ps1 -CheckOnly:$checksOnly -OutputDirectory "$env:GITHUB_WORKSPACE/dist" -CacheDirectory "$env:RUNNER_TEMP/voucher-dependency-cache"

      - name: Exercise the packaged executable with synthetic data
        if: github.event_name == 'workflow_dispatch'
        run: |
          $archives = @(Get-ChildItem dist/voucher-workbench-*-windows-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows test package.' }
          ./app/tools/smoke-windows.ps1 -ZipPath $archives[0].FullName -FixtureExecutable "$env:GITHUB_WORKSPACE/app/target/windows-dist/x86_64-pc-windows-msvc/release/examples/package_fixture.exe"

      - name: Exercise the real packaged CMD entry in isolated Windows consoles
        if: github.event_name == 'workflow_dispatch'
        run: |
          $archives = @(Get-ChildItem dist/voucher-workbench-*-windows-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows test package.' }
          $examples = "$env:GITHUB_WORKSPACE/app/target/windows-dist/x86_64-pc-windows-msvc/release/examples"
          ./app/tools/smoke-windows-launcher.ps1 -ZipPath $archives[0].FullName -FixtureExecutable "$examples/package_fixture.exe" -ProbeExecutable "$examples/startup_probe.exe"

      - name: Upload verified test package
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voucher-workbench-windows-x64-${{ github.run_number }}
          path: |
            dist/voucher-workbench-*-windows-x64.zip
            dist/voucher-workbench-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
