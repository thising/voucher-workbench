name: PDF Workbench Windows desktop checks and test package

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/windows.yml', '.gitattributes']
  pull_request:
    paths: ['app/**', '.github/workflows/windows.yml', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out tool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          $settings = Get-Content app/distribution/windows-dependencies.json -Raw | ConvertFrom-Json
          rustup toolchain install $settings.rust_toolchain --profile minimal --component rustfmt --component clippy --target $settings.target
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }

      - name: Restore public dependency and compilation cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target/windows-dist
            app/desktop/target/windows-dist
            ${{ runner.temp }}/pdf-dependency-cache
          key: pdf-windows-msvc-static-v1-${{ hashFiles('app/Cargo.lock', 'app/desktop/Cargo.lock', 'app/distribution/windows-dependencies.json') }}-${{ github.run_id }}
          restore-keys: |
            pdf-windows-msvc-static-v1-${{ hashFiles('app/Cargo.lock', 'app/desktop/Cargo.lock', 'app/distribution/windows-dependencies.json') }}-

      - name: Test Rust core and Tauri desktop; optionally assemble release attachments
        env:
          PACKAGE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          $checksOnly = $env:PACKAGE_REQUESTED -ne 'true'
          ./app/tools/build-windows-desktop.ps1 -CheckOnly:$checksOnly -OutputDirectory "$env:GITHUB_WORKSPACE/dist" -CacheDirectory "$env:RUNNER_TEMP/pdf-dependency-cache"

      - name: Exercise the same shipped GUI binary in headless compatibility mode
        if: github.event_name == 'workflow_dispatch'
        run: |
          $archives = @(Get-ChildItem dist/pdf-workbench-*-windows-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows test package.' }
          ./app/tools/smoke-windows.ps1 -ZipPath $archives[0].FullName -FixtureExecutable "$env:GITHUB_WORKSPACE/app/target/windows-dist/x86_64-pc-windows-msvc/release/examples/package_fixture.exe"

      - name: Prepare pinned native WebDriver and matching Microsoft EdgeDriver
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./app/tools/setup-windows-desktop-tests.ps1 -Directory "$env:RUNNER_TEMP/pdf-native-test-tools"

      - name: Exercise real portable and installed Tauri windows, IPC, native dialogs and safe close
        if: github.event_name == 'workflow_dispatch'
        run: |
          $archives = @(Get-ChildItem dist/pdf-workbench-*-windows-x64.zip)
          $installers = @(Get-ChildItem dist/pdf-workbench-*-windows-x64-setup.exe)
          if ($archives.Count -ne 1 -or $installers.Count -ne 1) { throw 'Expected one portable package and one installer.' }
          ./app/tools/smoke-windows-desktop.ps1 -ZipPath $archives[0].FullName -InstallerPath $installers[0].FullName -FixtureExecutable "$env:GITHUB_WORKSPACE/app/target/windows-dist/x86_64-pc-windows-msvc/release/examples/package_fixture.exe" -ToolsDirectory "$env:RUNNER_TEMP/pdf-native-test-tools" -EvidenceDirectory "$env:GITHUB_WORKSPACE/dist/desktop-verification"

      - name: Upload bounded native desktop evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-workbench-desktop-verification-${{ github.run_number }}
          path: |
            dist/desktop-verification/desktop-smoke-report.json
            dist/desktop-verification/desktop-window.png
            dist/desktop-verification/desktop-output-conflict.png
          if-no-files-found: warn
          retention-days: 14

      - name: Save public build cache after success or failure
        if: always() && steps.build-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target/windows-dist
            app/desktop/target/windows-dist
            ${{ runner.temp }}/pdf-dependency-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload verified test package
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-workbench-windows-x64-${{ github.run_number }}
          path: |
            dist/pdf-workbench-*-windows-x64.zip
            dist/pdf-workbench-*-windows-x64.zip.sha256
            dist/pdf-workbench-*-windows-x64-setup.exe
            dist/pdf-workbench-*-windows-x64-setup.exe.sha256
            dist/pdf-workbench-*-windows-x64-release.json
            dist/pdf-workbench-*-windows-x64-release.json.sha256
            dist/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
            dist/MicrosoftEdgeWebView2RuntimeInstallerX64.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
